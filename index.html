<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하루학점">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>하루학점 · Daily GPA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --ink:#000000; --sub:#8a8a8e; --line:#e5e5ea;
  --accent:#007aff; --ok:#34c759; --no:#ff3b30; --seg:#e9e9eb;
  --gA:#34c759; --gB:#007aff; --gC:#ff9f0a; --gD:#ff6b22; --gF:#ff3b30;
  --tabbg:rgba(249,249,249,.82);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --sub:#98989e; --line:#38383a;
    --accent:#0a84ff; --ok:#30d158; --no:#ff453a; --seg:#2c2c2e;
    --gA:#30d158; --gB:#0a84ff; --gC:#ffd60a; --gD:#ff9f0a; --gF:#ff453a;
    --tabbg:rgba(22,22,24,.82);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{font-size:17px; -webkit-text-size-adjust:100%; touch-action:manipulation}
button{touch-action:manipulation; -webkit-user-select:none; user-select:none}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
  line-height:1.45;
}
main{
  max-width:560px; margin:0 auto;
  padding:max(14px, env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom));
}
.group-label{
  font-size:.76rem; font-weight:600; color:var(--sub); text-transform:uppercase;
  letter-spacing:.04em; margin:20px 16px 7px;
}
.card{background:var(--card); border-radius:14px; overflow:hidden}
.row{
  display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 16px;
  border-bottom:.5px solid var(--line);
}
.row:last-child{border-bottom:none}
button{font-family:inherit; color:var(--ink)}
/* ---------- date bar ---------- */
.datebar{display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:14px}
.datebar button{
  border:none; background:none; color:var(--accent); font-size:1.35rem;
  width:44px; height:44px; cursor:pointer; border-radius:12px;
}
.datebar .dlabel{font-weight:700; font-size:1.05rem; min-width:148px; text-align:center}
.datebar .today-btn{width:auto; font-size:.85rem; font-weight:600; padding:0 10px}
/* ---------- grade hero ---------- */
.hero{display:flex; align-items:center; gap:16px; padding:18px 16px}
.grade-badge{
  width:74px; height:74px; border-radius:22px; display:flex; align-items:center; justify-content:center;
  font-size:1.85rem; font-weight:800; color:#fff; flex-shrink:0; letter-spacing:-.02em;
}
.grade-meta{flex:1; min-width:0}
.grade-meta .pct{font-size:1.12rem; font-weight:700}
.grade-meta .sub{color:var(--sub); font-size:.82rem}
.grade-bar{height:7px; border-radius:99px; background:var(--seg); margin-top:9px; overflow:hidden}
.grade-bar i{display:block; height:100%; border-radius:99px; transition:width .3s cubic-bezier(.3,.8,.4,1)}
/* ---------- segmented (성공/실패) ---------- */
.rlabel{font-weight:600; font-size:.98rem; flex-shrink:0}
.seg2{display:flex; margin-left:auto; background:var(--seg); border-radius:10px; padding:2px; gap:2px}
.seg2 button{
  border:none; background:none; color:var(--sub); border-radius:8px;
  padding:7px 16px; font-size:.9rem; font-weight:600; cursor:pointer; min-width:64px;
}
.seg2 button.ok{background:var(--ok); color:#fff; box-shadow:0 1px 4px rgba(0,0,0,.18)}
.seg2 button.no{background:var(--no); color:#fff; box-shadow:0 1px 4px rgba(0,0,0,.18)}
/* ---------- category ---------- */
.cat{padding:11px 16px; border-bottom:.5px solid var(--line)}
.cat:last-child{border-bottom:none}
.cat-head{display:flex; align-items:center; gap:8px}
.cat-head .name{font-weight:600; font-size:.98rem}
.cat-head .score{margin-left:auto; font-size:.94rem; color:var(--sub); font-variant-numeric:tabular-nums}
.cat-head .score b{color:var(--ink)}
.stepper{display:flex; gap:6px; margin-left:8px}
.stepper button{
  width:32px; height:32px; border-radius:99px; border:none;
  background:var(--seg); color:var(--accent); font-size:1.15rem; cursor:pointer; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.dots{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px}
.dot{
  width:34px; height:34px; border-radius:99px; border:1.5px solid var(--line);
  background:var(--bg); cursor:pointer; font-size:.78rem; color:var(--sub);
  display:flex; align-items:center; justify-content:center; font-weight:700;
}
.dot.on{background:var(--accent); border-color:var(--accent); color:#fff}
.cat.empty .name, .cat.empty .score{opacity:.4}
.hint{font-size:.78rem; color:var(--sub); margin:8px 16px 0; line-height:1.5}
/* ---------- month ---------- */
.gpa-hero{text-align:center; padding:20px 16px}
.gpa-hero .big{font-size:2.9rem; font-weight:800; letter-spacing:-.03em}
.gpa-hero .big small{font-size:1.1rem; color:var(--sub); font-weight:600}
.gpa-hero .lg{font-size:.98rem; font-weight:700; margin-top:2px}
.gpa-hero .sub{color:var(--sub); font-size:.82rem; margin-top:3px}
.cal{width:100%; border-collapse:collapse; table-layout:fixed}
.cal th{font-size:.7rem; color:var(--sub); font-weight:600; padding:0 0 6px}
.cal td{padding:1px}
.cal .cell{border-radius:10px; padding:4px 0 6px; text-align:center; cursor:pointer; min-height:46px}
.cal .cell .d{font-size:.72rem; color:var(--sub)}
.cal .cell.today .d{color:var(--accent); font-weight:800}
.cal .cell .g{
  display:inline-block; min-width:27px; padding:1px 4px; margin-top:2px; border-radius:7px;
  font-size:.7rem; font-weight:800; color:#fff;
}
.cal .cell .g.none{background:none; color:var(--line)}
.stat-row{display:flex; align-items:center; gap:10px; padding:9px 16px; border-bottom:.5px solid var(--line); font-size:.9rem}
.stat-row:last-child{border-bottom:none}
.stat-row .sname{width:100px; font-weight:600; flex-shrink:0; font-size:.88rem}
.stat-row .sbar{flex:1; height:6px; border-radius:99px; background:var(--seg); overflow:hidden}
.stat-row .sbar i{display:block; height:100%; background:var(--accent); border-radius:99px}
.stat-row .sval{width:86px; text-align:right; color:var(--sub); font-variant-numeric:tabular-nums; font-size:.8rem}
/* ---------- settings ---------- */
.set-row{display:flex; align-items:center; gap:10px; min-height:48px; padding:6px 16px; border-bottom:.5px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row label{font-size:.92rem; font-weight:600; flex-shrink:0; width:88px}
.set-row input[type=text], .set-row input[type=password]{
  flex:1; border:none; background:none; color:var(--ink); font-size:.92rem;
  font-family:inherit; text-align:right; outline:none; min-width:0;
}
.set-row input::placeholder{color:var(--sub); opacity:.6}
.btn-list button{
  display:block; width:100%; border:none; background:none; text-align:left;
  padding:13px 16px; font-size:.95rem; color:var(--accent); font-weight:600; cursor:pointer;
  border-bottom:.5px solid var(--line);
}
.btn-list button:last-child{border-bottom:none}
.gtable{width:100%; border-collapse:collapse; font-size:.85rem; font-variant-numeric:tabular-nums}
.gtable th,.gtable td{padding:6px 8px; text-align:center; border-bottom:.5px solid var(--line)}
.gtable tr:last-child td{border-bottom:none}
.gtable th{color:var(--sub); font-size:.72rem; font-weight:600}
.note{font-size:.78rem; color:var(--sub); line-height:1.6; margin:8px 16px 0}
.note code{background:var(--seg); padding:1px 5px; border-radius:5px; font-size:.74rem}
/* ---------- tab bar ---------- */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--tabbg); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar .inner{max-width:560px; margin:0 auto; display:flex}
#tabbar button{
  flex:1; border:none; background:none; color:var(--sub); cursor:pointer;
  padding:7px 0 6px; display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:.62rem; font-weight:600;
}
#tabbar button svg{width:25px; height:25px}
#tabbar button.on{color:var(--accent)}
/* ---------- toast ---------- */
#toast{
  position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(16px);
  background:var(--ink); color:var(--bg); padding:10px 20px; border-radius:99px;
  font-size:.85rem; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:99;
  max-width:88vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main id="view"></main>

<div id="tabbar"><div class="inner">
  <button data-view="entry" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M8.2 12.4l2.4 2.4 5.2-5.6"/></svg>
    오늘
  </button>
  <button data-view="month">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 20v-6M12 20V9M17 20V4.5"/></svg>
    성적표
  </button>
  <button data-view="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7.5h16M4 16.5h16"/><circle cx="9.5" cy="7.5" r="2.3" fill="var(--card)"/><circle cx="14.5" cy="16.5" r="2.3" fill="var(--card)"/></svg>
    설정
  </button>
</div></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   하루학점 — 플래너 GPA 산출기 (localStorage + GitHub .md 동기화)
   기록의 원본은 종이 플래너, 여기는 채점만.
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');

const DEFAULT_REPO = 'JIN-ARTLW/planner-data';   /* 토큰만 넣으면 바로 연동되게 프리셋 */
const SITE_REPO    = 'JIN-ARTLW/planner-gpa';    /* 금고(vault.json)가 놓이는 공개 저장소 — 커밋은 수동 */
const VAULT_ITER   = 1200000;                    /* PBKDF2 반복 횟수 */
const BIN_KEYS = ['wake','sleep'];   /* 성공/실패 이진 과목 */
const BINS = [
  {key:'wake',  label:'기상',  emoji:'⏰', desc:'계획한 기상'},
  {key:'sleep', label:'수면',  emoji:'😴', desc:'계획한 수면 시간'},
];
const CATS = [
  {key:'schedule', label:'일정',       emoji:'📅'},
  {key:'todo',     label:'투두',       emoji:'✅'},
  {key:'meal',     label:'식단',       emoji:'🍽️'},
  {key:'exercise', label:'운동',       emoji:'💪'},
  {key:'nottodo',  label:'하지 말 것', emoji:'🚫'},
];
/* 가중치 소비 순서 고정 (같은 날짜 = 같은 가중치, 기기 무관) */
const WEIGHT_ORDER = ['wake','sleep','schedule','todo','meal','exercise','nottodo'];
/* [최소 백분율, 등급, 평점] — 4.5 만점 */
const GRADE_TABLE = [
  [95,'A+',4.5],[90,'A0',4.0],[85,'B+',3.5],[80,'B0',3.0],
  [75,'C+',2.5],[70,'C0',2.0],[65,'D+',1.5],[60,'D0',1.0],[0,'F',0.0],
];
const WEEKDAYS = ['일','월','화','수','목','금','토'];
const DATA_MARK = 'planner-data:v1:';

/* ---------- 날짜 유틸 ---------- */
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => fmtDate(new Date());
const ymOf = date => date.slice(0,7);
const parseDate = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const shiftDate = (s,n) => { const d=parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); };
const shiftYm = (ym,n) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const dateLabel = s => { const d=parseDate(s); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`; };

/* ---------- 저장소 ---------- */
const monthKey = ym => 'pg:data:'+ym;
function loadMonth(ym){
  try{ return JSON.parse(localStorage.getItem(monthKey(ym))) || {days:{}}; }
  catch(e){ return {days:{}}; }
}
function saveMonth(ym,data){ localStorage.setItem(monthKey(ym), JSON.stringify(data)); }
function allMonthKeys(){
  return Object.keys(localStorage).filter(k=>k.startsWith('pg:data:')).map(k=>k.slice(8)).sort();
}
function blankEntry(date){
  const cats={}; CATS.forEach(c=>cats[c.key]={done:0,total:0});
  return {date, wake:null, sleep:null, cats, updatedAt:0};
}
function getEntry(date){
  const raw = loadMonth(ymOf(date)).days[date];
  if(!raw) return blankEntry(date);
  const e = blankEntry(date);
  /* 구버전(wake:{ok}) 호환 */
  BIN_KEYS.forEach(k=>{
    const v = raw[k];
    e[k] = (v && typeof v==='object') ? (v.ok===undefined?null:v.ok) : (v===undefined?null:v);
  });
  CATS.forEach(c=> e.cats[c.key] = Object.assign({done:0,total:0}, raw.cats && raw.cats[c.key]));
  e.updatedAt = raw.updatedAt||0;
  return e;
}
function updateEntry(date, mutate){
  const ym = ymOf(date);
  const data = loadMonth(ym);
  const e = getEntry(date);
  mutate(e);
  e.updatedAt = Date.now();
  data.days[date] = e;
  saveMonth(ym, data);
  markDirty(ym);
  return e;
}

/* ---------- 설정 (URL 해시 > localStorage > 기본값) ---------- */
function settings(){
  try{ return Object.assign({repo:DEFAULT_REPO,branch:'main',path:'data',token:''},
        JSON.parse(localStorage.getItem('pg:settings')||'{}')); }
  catch(e){ return {repo:DEFAULT_REPO,branch:'main',path:'data',token:''}; }
}
function saveSettings(patch){
  localStorage.setItem('pg:settings', JSON.stringify(Object.assign(settings(), patch)));
}
/* 시크릿 모드용: #t=토큰&r=owner/repo 를 북마크에 넣어두면 자동 연결 */
(function hashConfig(){
  const t = location.hash.match(/[#&]t=([^&]+)/);
  const r = location.hash.match(/[#&]r=([^&]+)/);
  const patch = {};
  if(t) patch.token = decodeURIComponent(t[1]);
  if(r) patch.repo = decodeURIComponent(r[1]);
  if(Object.keys(patch).length) saveSettings(patch);
})();

/* ============================================================
   채점 — 날짜별 비밀 가중치 + 난이도 커브
   같은 날짜는 항상 같은 결과(기기 간 동일). 예측은 포기하세요. 🤫
   ============================================================ */
function dayRng(date){
  let h=2166136261;
  for(let i=0;i<date.length;i++){ h^=date.charCodeAt(i); h=Math.imul(h,16777619); }
  let a=h>>>0;
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function gradeOf(entry){
  const rnd = dayRng(entry.date);
  const w = {}; WEIGHT_ORDER.forEach(k=> w[k] = 0.3 + rnd()*1.9);   /* 0.3 ~ 2.2 (최대 7배 차) */
  const curve = 1.15 + rnd()*0.4;                                    /* 난이도 커브 1.15 ~ 1.55 */
  const mixA  = 0.55 + rnd()*0.3;                                    /* 최약 과목 반영 비율 */
  const cutJit= Math.floor(rnd()*4);                                 /* 등급컷 0~3점 상향 */
  let ws=0, sum=0; const ratios=[];
  BIN_KEYS.forEach(k=>{
    if(entry[k]!==null){ const r=entry[k]?1:0; ws+=w[k]; sum+=w[k]*r; ratios.push(r); }
  });
  CATS.forEach(c=>{
    const {done,total}=entry.cats[c.key];
    if(total>0){ const r=Math.min(done,total)/total; ws+=w[c.key]; sum+=w[c.key]*r; ratios.push(r); }
  });
  if(!ratios.length) return null;
  /* 가중 평균 × 최약 과목 페널티(바닥 0.35) × 난이도 커브 — 전부 지키면 정확히 100 */
  const mixed = mixA*(sum/ws) + (1-mixA)*(0.35 + 0.65*Math.min(...ratios));
  const pct = Math.pow(mixed, curve)*100;
  const row = GRADE_TABLE.find(([min,l])=> l==='F' || pct >= min+cutJit);
  return {pct, letter:row[1], points:row[2]};
}
function gradeColor(letter){
  if(!letter) return 'var(--seg)';
  const c=letter[0];
  return c==='A'?'var(--gA)':c==='B'?'var(--gB)':c==='C'?'var(--gC)':c==='D'?'var(--gD)':'var(--gF)';
}
function letterForPct(pct){ return GRADE_TABLE.find(([min])=>pct>=min)[1]; }
function monthStats(ym){
  const days = loadMonth(ym).days;
  const graded=[]; const catAgg={}; CATS.forEach(c=>catAgg[c.key]={done:0,total:0});
  const binAgg={wake:{ok:0,all:0}, sleep:{ok:0,all:0}};
  Object.keys(days).sort().forEach(date=>{
    const e=getEntry(date);
    const g=gradeOf(e);
    if(g) graded.push({date,g});
    CATS.forEach(c=>{ catAgg[c.key].done+=Math.min(e.cats[c.key].done,e.cats[c.key].total); catAgg[c.key].total+=e.cats[c.key].total; });
    BIN_KEYS.forEach(k=>{ if(e[k]!==null){ binAgg[k].all++; if(e[k]) binAgg[k].ok++; } });
  });
  const gpa = graded.length ? graded.reduce((a,x)=>a+x.g.points,0)/graded.length : null;
  const avgPct = graded.length ? graded.reduce((a,x)=>a+x.g.pct,0)/graded.length : null;
  return {graded, gpa, avgPct, catAgg, binAgg};
}

/* ---------- 상태 ---------- */
const state = { view:'entry', date:todayStr(), month:ymOf(todayStr()) };
const dirtyMonths = new Set();
let pushTimer=null;
function markDirty(ym){
  dirtyMonths.add(ym);
  const s=settings();
  if(s.repo && s.token){
    clearTimeout(pushTimer);
    pushTimer=setTimeout(()=>pushDirty(true), 1500);
  }
}
let toastTimer=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   GitHub 동기화 (contents API, 월별 .md)
   ============================================================ */
const b64encode = str => {
  const bytes = new TextEncoder().encode(str);
  let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin);
};
const b64decode = b64 => {
  const bin = atob(b64.replace(/\s/g,''));
  const bytes = Uint8Array.from(bin, ch=>ch.charCodeAt(0));
  return new TextDecoder().decode(bytes);
};
/* ---------- 토큰 금고 — 암호(PBKDF2+AES-GCM) 기반, vault.json은 공개 저장소에 수동 커밋 ---------- */
const bytesToB64 = u8 => { let s=''; u8.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); };
const b64ToBytes = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function vaultKey(pass, salt, iter){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, km,
    {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function makeVaultBlob(pass){
  const s=settings();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await vaultKey(pass, salt, VAULT_ITER);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(s.token)));
  return JSON.stringify({v:1, iter:VAULT_ITER, repo:s.repo, branch:s.branch, path:s.path,
    salt:bytesToB64(salt), iv:bytesToB64(iv), ct:bytesToB64(ct)});
}
let siteVault=null;
async function loadSiteVault(){
  try{
    const r=await fetch('vault.json', {cache:'no-store'});
    if(r.ok) siteVault=await r.json();
  }catch(e){}
}
async function unlockVault(pass){
  if(!siteVault) return;
  if(!pass) return toast('금고 암호를 입력하세요');
  try{
    const key=await vaultKey(pass, b64ToBytes(siteVault.salt), siteVault.iter||VAULT_ITER);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBytes(siteVault.iv)}, key, b64ToBytes(siteVault.ct));
    const token=new TextDecoder().decode(pt);
    saveSettings({token, repo:siteVault.repo||DEFAULT_REPO, branch:siteVault.branch||'main',
                  path:siteVault.path!==undefined?siteVault.path:'data'});
    toast('🔓 연동됐어요!');
    pullMonth(state.month, true); pullMonth(shiftYm(state.month,-1), true);
    render();
  }catch(e){ toast('암호가 맞지 않아요'); }
}

function ghUrl(fname){
  const s=settings();
  const parts=[...(s.path? s.path.split('/').filter(Boolean):[]), fname];
  return `https://api.github.com/repos/${s.repo}/contents/${parts.map(encodeURIComponent).join('/')}`;
}
async function ghGet(fname){
  const s=settings();
  const r=await fetch(ghUrl(fname)+`?ref=${encodeURIComponent(s.branch)}`,{
    headers:{Authorization:`Bearer ${s.token}`, Accept:'application/vnd.github+json'}
  });
  if(r.status===404) return null;
  if(!r.ok) throw new Error(`GitHub GET ${r.status}`);
  return r.json();
}
async function ghPut(fname, content, sha, message, keepalive){
  const s=settings();
  const body={message, content:b64encode(content), branch:s.branch};
  if(sha) body.sha=sha;
  const r=await fetch(ghUrl(fname),{
    method:'PUT', keepalive:!!keepalive,
    headers:{Authorization:`Bearer ${s.token}`, Accept:'application/vnd.github+json'},
    body:JSON.stringify(body)
  });
  if(!r.ok){
    const t=await r.text().catch(()=> '');
    throw new Error(`GitHub PUT ${r.status} ${t.slice(0,120)}`);
  }
  return r.json();
}

/* ---------- .md 생성/파싱 ---------- */
function entryMd(e){
  const g=gradeOf(e);
  const head=`## ${e.date} (${WEEKDAYS[parseDate(e.date).getDay()]})${g?` — **${g.letter}** (${g.points.toFixed(1)} / ${g.pct.toFixed(0)}%)`:''}`;
  const items=[];
  BINS.forEach(b=>{ if(e[b.key]!==null) items.push(`${b.label} ${e[b.key]?'✅':'❌'}`); });
  CATS.forEach(c=>{
    const {done,total}=e.cats[c.key];
    if(total>0) items.push(`${c.label} ${Math.min(done,total)}/${total}`);
  });
  return items.length ? `${head}\n- ${items.join(' · ')}` : head;
}
function monthMd(ym){
  const data=loadMonth(ym);
  const st=monthStats(ym);
  const out=[`# ${ym} 플래너 성적표`,''];
  if(st.gpa!==null){
    out.push(`> **월 평점 ${st.gpa.toFixed(2)} / 4.5** · 평균 달성률 ${st.avgPct.toFixed(0)}% · 기록 ${st.graded.length}일`,'');
  }
  Object.keys(data.days).sort().forEach(date=>{ out.push(entryMd(getEntry(date)),''); });
  out.push('---');
  out.push(`<!-- ${DATA_MARK}${b64encode(JSON.stringify(data))} -->`);
  out.push('');
  return out.join('\n');
}
function parseMonthMd(text){
  const m=text.match(new RegExp(DATA_MARK.replace(/[:]/g,'\\$&')+'([A-Za-z0-9+/=\\s]+?)\\s*-->'));
  if(!m) return null;
  try{ return JSON.parse(b64decode(m[1])); }catch(e){ return null; }
}
function mergeMonth(ym, incoming){
  if(!incoming || !incoming.days) return 0;
  const data=loadMonth(ym);
  let changed=0;
  Object.keys(incoming.days).forEach(date=>{
    const local=data.days[date], remote=incoming.days[date];
    if(!local || (remote.updatedAt||0) > (local.updatedAt||0)){ data.days[date]=remote; changed++; }
  });
  if(changed) saveMonth(ym,data);
  return changed;
}

/* ---------- push / pull ---------- */
const shaCache = {};   /* ym → 마지막으로 확인한 파일 sha (탭 닫힘 직전 즉시 저장용) */
async function pushMonth(ym){
  const fname=`${ym}.md`;
  const existing=await ghGet(fname);
  const res=await ghPut(fname, monthMd(ym), existing && existing.sha, `planner: ${ym} 기록 업데이트`);
  if(res && res.content) shaCache[ym]=res.content.sha;
  dirtyMonths.delete(ym);
}
/* 시크릿 탭이 닫히거나 화면을 벗어나면 대기 없이 바로 저장 */
function flushNow(){
  const s=settings();
  if(!dirtyMonths.size || !s.repo || !s.token) return;
  clearTimeout(pushTimer);
  [...dirtyMonths].forEach(ym=>{
    ghPut(`${ym}.md`, monthMd(ym), shaCache[ym], `planner: ${ym} 기록 업데이트`, true)
      .then(res=>{ if(res && res.content) shaCache[ym]=res.content.sha; dirtyMonths.delete(ym); })
      .catch(()=>{});   /* 실패 시 dirty 유지 → 페이지가 살아있으면 다음 저장에서 재시도 */
  });
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushNow(); });
window.addEventListener('pagehide', flushNow);
async function pushDirty(silent){
  const s=settings();
  if(!s.repo||!s.token){ if(!silent) toast('설정에서 토큰을 먼저 연결하세요'); return; }
  const targets=dirtyMonths.size?[...dirtyMonths]:[state.month];
  try{
    for(const ym of targets) await pushMonth(ym);
    toast(`☁️ 저장 완료 (${targets.join(', ')})`);
  }catch(err){ toast('업로드 실패: '+err.message); }
}
async function pullMonth(ym, silent){
  const s=settings();
  if(!s.repo||!s.token){ if(!silent) toast('설정에서 토큰을 먼저 연결하세요'); return; }
  try{
    const f=await ghGet(`${ym}.md`);
    if(!f){ if(!silent) toast(`${ym}.md 파일이 아직 없어요`); return; }
    shaCache[ym]=f.sha;
    const n=mergeMonth(ym, parseMonthMd(b64decode(f.content)));
    if(!silent) toast(n?`${ym}: ${n}일치 불러옴`:`${ym}: 이미 최신이에요`);
    if(n) render();
  }catch(err){ if(!silent) toast('불러오기 실패: '+err.message); }
}

function renderMonth(){

  let rows=''; let day=1-first.getDay();
  while(day<=daysInMonth){

    for(let i=0;i<7;i++,day++){
      if(day<1||day>daysInMonth){ cells+='<td></td>'; continue; }
      const date=`${ym}-${pad(day)}`;
      const g=monthDays[date]?gradeOf(getEntry(date)):null;
      cells+=`<td><div class="cell ${date===today?'today':''}" data-act="cal-day" data-date="${date}">
        <div class="d">${day}</div>
        ${g?`<span class="g" style="background:${gradeColor(g.letter)}">${g.letter}</span>`:'<span class="g none">·</span>'}

  const statRows=[
    ...BINS.map(b=>{const a=st.binAgg[b.key]; return {label:`${b.emoji} ${b.label}`, pct:a.all?a.ok/a.all*100:null, txt:a.all?`${a.ok}/${a.all}`:''};}),
    ...CATS.map(c=>{const a=st.catAgg[c.key]; return {label:`${c.emoji} ${c.label}`, pct:a.total?a.done/a.total*100:null, txt:a.total?`${a.done}/${a.total}`:''};}),
  ];
  const statRowH=58, statH=78+statRows.length*statRowH+14;
  const H=230+heroH+36+calH+36+statH+92;

  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  x.fillStyle='#0c0c0e'; x.fillRect(0,0,W,H);

  /* 헤더 */
  x.textAlign='left';
  x.fillStyle='#98989e'; x.font=FT(600,30); x.fillText('🎓 하루학점 · Daily GPA', P, 96);
  x.fillStyle='#ffffff'; x.font=FT(800,60); x.fillText(`${y}년 ${m}월 성적표`, P, 180);

  const card=(cy,ch)=>{ x.fillStyle='#1c1c1e'; x.beginPath(); x.roundRect(P,cy,W-2*P,ch,28); x.fill(); };
  let top=230;

  /* GPA 히어로 */
  card(top,heroH);
  const cx=W/2;
  const gpaTxt=st.gpa!==null?st.gpa.toFixed(2):'–';
  x.font=FT(800,104); const gw=x.measureText(gpaTxt).width;
  x.font=FT(600,40);  const sw=x.measureText(' / 4.5').width;
  let sx=cx-(gw+sw)/2;
  x.fillStyle='#ffffff'; x.font=FT(800,104); x.fillText(gpaTxt,sx,top+120);
  x.fillStyle='#98989e'; x.font=FT(600,40);  x.fillText(' / 4.5',sx+gw,top+120);
  x.textAlign='center';
  if(st.avgPct!==null){
    const L=letterForPct(st.avgPct);
    x.fillStyle=GRADE_HEX[L[0]]; x.font=FT(700,40);
    x.fillText(`평균 ${st.avgPct.toFixed(0)}점 · ${L}`, cx, top+184);
  }else{
    x.fillStyle='#6e6e73'; x.font=FT(600,34); x.fillText('기록 없음', cx, top+184);
  }
  top+=heroH+36;

  /* 달력 */
  card(top,calH);
  const gridW=W-2*P-48, colW=gridW/7, gx0=P+24;
  x.font=FT(600,26);
  WEEKDAYS.forEach((d,i)=>{
    x.fillStyle= i===0?'#ff6b6b': i===6?'#5ea0ff':'#98989e';
    x.fillText(d, gx0+colW*i+colW/2, top+46);
  });
  let day=1-first.getDay();
  for(let r=0;r<weeks;r++){
    for(let c=0;c<7;c++,day++){
      if(day<1||day>dim) continue;
      const ccx=gx0+colW*c+colW/2, ccy=top+calHeadH+r*calRowH;
      x.fillStyle='#8e8e93'; x.font=FT(600,26); x.fillText(String(day), ccx, ccy+30);
      const date=`${ym}-${pad(day)}`;
      const g=days[date]?gradeOf(getEntry(date)):null;
      if(g){
        const hex=GRADE_HEX[g.letter[0]];
        x.fillStyle=hex; x.beginPath(); x.roundRect(ccx-34,ccy+42,68,46,14); x.fill();
        x.fillStyle=(g.letter[0]==='C'||g.letter[0]==='D')?'#000':'#fff';
        x.font=FT(800,28); x.fillText(g.letter, ccx, ccy+75);
      }else{
        x.fillStyle='#3a3a3c'; x.beginPath(); x.arc(ccx,ccy+62,4,0,7); x.fill();
      }
    }
  }
  top+=calH+36;

  /* 과목별 달성률 */
  card(top,statH);
  x.textAlign='left'; x.fillStyle='#98989e'; x.font=FT(700,28);
  x.fillText('과목별 달성률', P+28, top+52);
  statRows.forEach((s,i)=>{
    const ry=top+78+i*statRowH+34;
    x.fillStyle='#ffffff'; x.font=FT(600,28); x.textAlign='left';
    x.fillText(s.label, P+28, ry);
    const bx=P+272, bw=W-2*P-272-176, bh=14;
    x.fillStyle='#2c2c2e'; x.beginPath(); x.roundRect(bx,ry-14,bw,bh,7); x.fill();
    if(s.pct){ x.fillStyle='#0a84ff'; x.beginPath(); x.roundRect(bx,ry-14,bw*Math.min(1,s.pct/100),bh,7); x.fill(); }
    x.fillStyle='#98989e'; x.font=FT(600,25); x.textAlign='right';
    x.fillText(s.pct!==null?`${s.txt} · ${s.pct.toFixed(0)}%`:'–', W-P-28, ry);
  });

  /* 푸터 */
  x.fillStyle='#5a5a5e'; x.font=FT(600,24); x.textAlign='center';
  x.fillText(`${st.graded.length}일 채점 · 하루학점`, W/2, H-40);
  return cv;
}
function downloadMonthImage(ym){
  const cv=buildMonthCanvas(ym);
  cv.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=`${ym}-성적표.png`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  },'image/png');
}

/* ---------- 파일 ---------- */
function download(fname, text, mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));
  a.download=fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
function pickFile(cb){
  const inp=$('#filePick')||Object.assign(document.createElement('input'),{type:'file'});
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>cb(f.name, r.result); r.readAsText(f); inp.value=''; };
  inp.click();
}
function backupJson(){
  const dump={settings:Object.assign(settings(),{token:''}), months:{}};
  allMonthKeys().forEach(ym=>dump.months[ym]=loadMonth(ym));
  download(`planner-backup-${todayStr()}.json`, JSON.stringify(dump,null,2), 'application/json');
}

/* ============================================================
   이벤트
   ============================================================ */
$$('#tabbar button').forEach(b=>b.addEventListener('click',()=>{ state.view=b.dataset.view; render(); window.scrollTo(0,0); }));

$('#view').addEventListener('click', ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;

  if(act==='date-shift'){ state.date=shiftDate(state.date,+el.dataset.d); renderEntry(); }
  else if(act==='date-today'){ state.date=todayStr(); renderEntry(); }
  else if(act==='bin'){
    const k=el.dataset.k, v=el.dataset.v==='1';
    updateEntry(state.date, x=>x[k] = (x[k]===v?null:v));
    renderEntry();
  }
  else if(act==='total'){
    const cat=el.dataset.cat, d=+el.dataset.d;
    updateEntry(state.date, x=>{
      const c=x.cats[cat];
      c.total=Math.max(0, Math.min(30, c.total+d));
      c.done=Math.min(c.done, c.total);
    });
    renderEntry();
  }
  else if(act==='dot'){
    const cat=el.dataset.cat, i=+el.dataset.i;
    updateEntry(state.date, x=>{
      const c=x.cats[cat];
      c.done = (c.done===i)? i-1 : i;   /* 같은 번호 다시 누르면 하나 취소 */
    });
    renderEntry();
  }
  else if(act==='month-shift'){ state.month=shiftYm(state.month,+el.dataset.d); renderMonth(); }
  else if(act==='cal-day'){ state.date=el.dataset.date; state.view='entry'; render(); window.scrollTo(0,0); }
  else if(act==='export-img'){ downloadMonthImage(state.month); toast('🖼️ 이미지 저장 중…'); }
  else if(act==='push-month'){ dirtyMonths.add(state.month); pushDirty(false); }
  else if(act==='pull-month'){ pullMonth(state.month, false); }
  else if(act==='gh-test'){
    (async()=>{
      const s=settings();
      if(!s.repo||!s.token) return toast('토큰을 입력하세요');
      try{
        const r=await fetch(`https://api.github.com/repos/${s.repo}`,{headers:{Authorization:`Bearer ${s.token}`}});
        toast(r.ok?'✅ 연결 성공!':'❌ 실패: '+r.status+(r.status===404?' (저장소/토큰 권한 확인)':''));
      }catch(e){ toast('❌ 실패: '+e.message); }
    })();
  }
  else if(act==='vault-create'){ createVault(); }
  else if(act==='vault-unlock'){ unlockVault($('#vaultPass').value); }
  else if(act==='copy-bookmark'){
    const s=settings();
    if(!s.token) return toast('토큰을 먼저 입력하세요');
    const url=`${location.origin}${location.pathname}#t=${encodeURIComponent(s.token)}&r=${encodeURIComponent(s.repo)}`;
    navigator.clipboard.writeText(url).then(
      ()=>toast('복사됐어요! 북마크로 저장하세요'),
      ()=>{ prompt('이 주소를 북마크에 저장하세요', url); });
  }
  else if(act==='backup-json'){ backupJson(); }
  else if(act==='import-md'){
    pickFile((name,text)=>{
      const data=parseMonthMd(text);
      if(!data) return toast('.md에서 데이터 블록을 못 찾았어요');
      const dates=Object.keys(data.days||{});
      if(!dates.length) return toast('기록이 비어 있어요');
      const n=mergeMonth(ymOf(dates[0]), data);
      toast(`${n}일치 가져옴`); render();
    });
  }
  else if(act==='restore-json'){
    pickFile((name,text)=>{
      try{
        const dump=JSON.parse(text);
        let n=0;
        Object.keys(dump.months||{}).forEach(ym=>{ n+=mergeMonth(ym, dump.months[ym]); });
        toast(`${n}일치 복원됨`); render();
      }catch(e){ toast('올바른 백업 파일이 아니에요'); }
    });
  }
});

/* ---------- 시작 ---------- */
render();
loadSiteVault().then(()=>{ if(!settings().token && siteVault) render(); });
(function initialSync(){
  const s=settings();
  if(s.repo&&s.token){
    pullMonth(state.month, true);
    pullMonth(shiftYm(state.month,-1), true);
  }
})();
</script>
